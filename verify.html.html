<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>Verify Student · Musta'athin</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        .verify-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f6fb;
            padding: 1.5rem;
        }
        .verify-card {
            background: white;
            border-radius: 40px;
            padding: 3rem 2.5rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            border: 1px solid #e9edf4;
        }
        .verify-card .school-icon {
            font-size: 2.5rem;
            color: #1e7b64;
            margin-bottom: 0.5rem;
        }
        .verify-card h2 {
            color: #0b2b4a;
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.2rem;
        }
        .verify-card .subtitle {
            color: #6b88a2;
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }
        .verify-student-name {
            font-size: 2.8rem;
            font-weight: 700;
            color: #0a263b;
            margin: 1rem 0 0.5rem;
        }
        .verify-status-large {
            display: inline-block;
            padding: 0.6rem 2.5rem;
            border-radius: 60px;
            font-size: 1.6rem;
            font-weight: 700;
            margin: 1rem 0 0.5rem;
        }
        .verify-status-large.permitted {
            background: #d3f0e5;
            color: #006b4e;
        }
        .verify-status-large.not-permitted {
            background: #fce8e8;
            color: #b13e3e;
        }
        .verify-timestamp {
            color: #6f8da6;
            font-size: 0.8rem;
            margin-top: 1.5rem;
        }
        .refresh-indicator {
            color: #6f8da6;
            font-size: 0.7rem;
            margin-top: 0.5rem;
            opacity: 0.7;
        }
        .loading-spinner {
            font-size: 2rem;
            color: #1e7b64;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-message {
            color: #b13e3e;
            font-size: 1rem;
            padding: 1rem;
            background: #fce8e8;
            border-radius: 16px;
        }
        .student-id-hint {
            color: #889fb5;
            font-size: 0.7rem;
            margin-top: 0.2rem;
        }
        @media (max-width: 500px) {
            .verify-card {
                padding: 2rem 1.5rem;
            }
            .verify-student-name {
                font-size: 2rem;
            }
            .verify-status-large {
                font-size: 1.2rem;
                padding: 0.4rem 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="verify-page">
        <div class="verify-card" id="verifyCard">
            <div class="school-icon"><i class="fas fa-graduation-cap"></i></div>
            <h2>Hawazen High School</h2>
            <div class="subtitle">Student Permission Verification</div>
            
            <div id="verificationContent">
                <div class="loading-spinner"><i class="fas fa-spinner"></i></div>
                <p style="margin-top: 1rem; color: #6b88a2;">Loading student status...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ===== تكوين Supabase =====
        const SUPABASE_URL = 'https://qnxiyrfdvqskwfcmmptw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_pub1shable_NV8m1fyVZq29VKBdGhQnsw_euvyz...';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const studentName = urlParams.get('student');

        async function loadStudentStatus() {
            const content = document.getElementById('verificationContent');
            
            if (!studentName) {
                content.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i> Invalid QR code
                    </div>
                    <p style="margin-top: 1rem; color: #6b88a2; font-size: 0.9rem;">
                        Please scan a valid student QR code.
                    </p>
                `;
                return;
            }

            try {
                const { data, error } = await supabase
                    .from('students')
                    .select('name, permitted')
                    .eq('name', studentName)
                    .single();

                if (error || !data) {
                    content.innerHTML = `
                        <div class="error-message">
                            <i class="fas fa-exclamation-triangle"></i> Student not found
                        </div>
                        <p style="margin-top: 1rem; color: #6b88a2; font-size: 0.9rem;">
                            The QR code does not correspond to any registered student.
                        </p>
                        <div class="student-id-hint">Student: ${studentName}</div>
                    `;
                    return;
                }

                const status = data.permitted;
                const statusText = status ? 'Permitted' : 'Not Permitted';
                const statusClass = status ? 'permitted' : 'not-permitted';
                const statusIcon = status ? '🟢' : '🔴';

                content.innerHTML = `
                    <div class="verify-student-name">${data.name}</div>
                    <div class="verify-status-large ${statusClass}">${statusIcon} ${statusText}</div>
                    <div class="verify-timestamp">
                        <i class="fas fa-clock"></i> Status as of now
                    </div>
                    <div class="refresh-indicator">
                        <i class="fas fa-sync-alt fa-fw"></i> Auto-refreshes every 10s
                    </div>
                `;

                let refreshInterval = setInterval(async () => {
                    try {
                        const { data: refreshData, error: refreshError } = await supabase
                            .from('students')
                            .select('permitted')
                            .eq('name', studentName)
                            .single();

                        if (!refreshError && refreshData) {
                            const newStatus = refreshData.permitted;
                            const newText = newStatus ? 'Permitted' : 'Not Permitted';
                            const newClass = newStatus ? 'permitted' : 'not-permitted';
                            const newIcon = newStatus ? '🟢' : '🔴';
                            
                            const statusEl = content.querySelector('.verify-status-large');
                            if (statusEl) {
                                statusEl.className = `verify-status-large ${newClass}`;
                                statusEl.innerHTML = `${newIcon} ${newText}`;
                            }
                        }
                    } catch (e) {}
                }, 10000);

                window.addEventListener('beforeunload', () => {
                    clearInterval(refreshInterval);
                });

            } catch (error) {
                content.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i> Connection error
                    </div>
                    <p style="margin-top: 1rem; color: #6b88a2; font-size: 0.9rem;">
                        Please check your internet connection and try again.
                    </p>
                `;
            }
        }

        loadStudentStatus();
    </script>
</body>
</html>
