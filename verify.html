<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>التحقق من الطالب · ثانوية هوزان</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Tajawal', 'Inter', -apple-system, system-ui, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            color: #2a1e4a;
        }

        .verify-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .verify-card {
            background: white;
            border-radius: 32px;
            padding: 2.5rem 2rem;
            max-width: 560px;
            width: 100%;
            text-align: center;
            border: 2px solid #ede4ff;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.06);
        }

        .school-icon { font-size: 2.5rem; color: #7c3aed; margin-bottom: 0.5rem; }
        .school-title { color: #4c1d95; font-weight: 700; font-size: 1.1rem; }

        .verify-student-name {
            font-size: 2.2rem;
            font-weight: 700;
            color: #3b1e6b;
            margin: 1.5rem 0 1rem;
            word-break: break-word;
        }

        /* ===== عقوبة سارية ===== */
        .penalty-alert {
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
            border: 3px solid #dc2626;
            border-radius: 20px;
            padding: 1.2rem;
            margin: 1rem 0;
            text-align: right;
            position: relative;
            overflow: hidden;
            animation: penaltyPulse 2s ease infinite;
        }

        @keyframes penaltyPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.3); }
            50% { box-shadow: 0 0 0 8px rgba(220, 38, 38, 0); }
        }

        .penalty-alert-header {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            margin-bottom: 0.8rem;
        }

        .penalty-alert-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, #f87171 0%, #dc2626 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
            box-shadow: 0 4px 14px rgba(220, 38, 38, 0.4);
        }

        .penalty-alert-title strong {
            display: block;
            font-size: 1.05rem;
            font-weight: 800;
            color: #b13e3e;
        }

        .penalty-alert-title span {
            display: block;
            font-size: 0.72rem;
            color: #8b7db8;
            margin-top: 0.15rem;
        }

        .penalty-alert-info {
            background: white;
            border-radius: 14px;
            padding: 0.8rem;
        }

        .penalty-alert-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            font-size: 0.82rem;
            border-bottom: 1px dashed #fee2e2;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .penalty-alert-row:last-child { border-bottom: none; }

        .penalty-alert-label {
            color: #6b5b95;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .penalty-alert-label i { color: #dc2626; font-size: 0.8rem; }

        .penalty-alert-value {
            color: #3b1e6b;
            font-weight: 700;
            text-align: left;
            flex: 1;
            word-break: break-word;
        }

        .penalty-alert-value.highlight {
            color: #dc2626;
            background: #fef2f2;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            text-align: center;
            flex: 0 0 auto;
        }

        /* ===== حالات عادية ===== */
        .verify-section {
            margin: 1rem 0;
            padding: 1rem;
            border-radius: 20px;
            background: #fbf9ff;
            border: 2px solid #f3ecff;
        }

        .verify-section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #6b5b95;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .verify-status-large {
            display: inline-block;
            padding: 0.5rem 2rem;
            border-radius: 60px;
            font-size: 1.3rem;
            font-weight: 700;
            margin: 0.3rem 0;
        }

        .verify-status-large.permitted { background: #d3f0e5; color: #006b4e; }
        .verify-status-large.not-permitted { background: #fce8e8; color: #b13e3e; }

        .verify-time {
            color: #3b1e6b;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 0.6rem;
            padding: 0.4rem 0.8rem;
            background: #f7f3ff;
            border-radius: 12px;
            border: 1px solid #ede4ff;
            display: inline-block;
        }

        .verify-time i { color: #7c3aed; margin-left: 0.4rem; font-size: 0.8rem; }

        /* ===== بيانات الطالب ===== */
        .verify-info-section {
            background: #f7f3ff;
            border: 2px solid #ede4ff;
            border-radius: 20px;
            padding: 1rem;
            margin: 1rem 0;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 0.9rem;
            background: white;
            border-radius: 12px;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            gap: 0.5rem;
            border: 1px solid #f3ecff;
        }

        .info-item:last-child { margin-bottom: 0; }

        .info-item-label {
            color: #6b5b95;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-shrink: 0;
        }

        .info-item-label i { color: #7c3aed; font-size: 0.85rem; }

        .info-item-value {
            color: #3b1e6b;
            font-weight: 700;
            background: #f7f3ff;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            border: 1px solid #ede4ff;
            direction: ltr;
            text-align: left;
            word-break: break-word;
            max-width: 60%;
        }

        /* ===== الملاحظات ===== */
        .verify-notes-section {
            background: #fffbeb;
            border: 2px solid #fde68a;
            border-radius: 20px;
            padding: 1rem;
            margin: 1rem 0;
            text-align: right;
        }

        .verify-notes-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #b45309;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .verify-notes-content {
            background: white;
            border-radius: 12px;
            padding: 0.8rem 1rem;
            color: #3b1e6b;
            font-size: 0.9rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: 1px solid #fef3c7;
        }

        /* ===== سجل السلوكيات ===== */
        .verify-behaviors-section {
            background: #fbf9ff;
            border: 2px solid #f3ecff;
            border-radius: 20px;
            padding: 1rem;
            margin: 1rem 0;
            text-align: right;
        }

        .verify-behaviors-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .verify-behaviors-header-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #4c1d95;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .verify-behaviors-stats {
            display: flex;
            gap: 0.4rem;
        }

        .verify-stat-mini {
            padding: 0.25rem 0.7rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .verify-stat-mini.positive { background: #d3f0e5; color: #006b4e; }
        .verify-stat-mini.negative { background: #fce8e8; color: #b13e3e; }

        .verify-behaviors-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 0.3rem;
        }

        .verify-behavior-item {
            display: flex;
            gap: 0.6rem;
            padding: 0.7rem;
            border-radius: 12px;
            border: 2px solid;
        }

        .verify-behavior-item.positive {
            background: linear-gradient(135deg, #f0fdf4 0%, #f7fdf9 100%);
            border-color: #bbf7d0;
        }

        .verify-behavior-item.negative {
            background: linear-gradient(135deg, #fef2f2 0%, #fff7f7 100%);
            border-color: #fecaca;
        }

        .verify-behavior-icon {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            flex-shrink: 0;
            color: white;
        }

        .verify-behavior-item.positive .verify-behavior-icon {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
        }

        .verify-behavior-item.negative .verify-behavior-icon {
            background: linear-gradient(135deg, #f87171 0%, #ef4444 100%);
        }

        .verify-behavior-content { flex: 1; min-width: 0; }

        .verify-behavior-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.25rem;
            flex-wrap: wrap;
        }

        .verify-behavior-type {
            font-size: 0.75rem;
            font-weight: 700;
        }

        .verify-behavior-item.positive .verify-behavior-type { color: #006b4e; }
        .verify-behavior-item.negative .verify-behavior-type { color: #b13e3e; }

        .verify-behavior-date {
            font-size: 0.6rem;
            color: #8b7db8;
        }

        .verify-behavior-category {
            font-size: 0.65rem;
            color: #7c3aed;
            font-weight: 600;
            margin-bottom: 0.2rem;
        }

        .verify-behavior-details {
            font-size: 0.78rem;
            color: #3b1e6b;
            line-height: 1.5;
            word-break: break-word;
        }

        .verify-no-data {
            text-align: center;
            color: #a78bfa;
            font-style: italic;
            font-size: 0.82rem;
            padding: 1rem 0;
        }

        /* ===== Footer ===== */
        .verify-timestamp {
            color: #8b7db8;
            font-size: 0.75rem;
            margin-top: 1.5rem;
        }

        .verify-timestamp i { color: #7c3aed; margin-left: 0.3rem; }

        .refresh-indicator {
            color: #a78bfa;
            font-size: 0.7rem;
            margin-top: 0.4rem;
            opacity: 0.8;
        }

        /* ===== Loading ===== */
        .loading-spinner {
            font-size: 2rem;
            color: #7c3aed;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text { color: #8b7db8; font-size: 0.9rem; margin-top: 1rem; }

        /* ===== Error ===== */
        .error-message {
            color: #b13e3e;
            font-size: 1rem;
            padding: 1rem;
            background: #fce8e8;
            border-radius: 16px;
        }

        .error-details {
            margin-top: 1rem;
            padding: 0.9rem;
            background: #f7f3ff;
            border-radius: 12px;
            font-size: 0.75rem;
            color: #6b5b95;
            text-align: right;
            border: 1px solid #ede4ff;
        }

        .error-details code {
            direction: ltr;
            display: inline-block;
            background: white;
            padding: 0.3rem 0.7rem;
            border-radius: 8px;
            word-break: break-all;
            color: #b13e3e;
            font-weight: 600;
        }

        .error-details .name-chip {
            display: inline-block;
            background: white;
            padding: 0.2rem 0.6rem;
            border-radius: 8px;
            margin: 0.15rem;
            color: #3b1e6b;
            font-weight: 600;
        }

        @media (max-width: 500px) {
            .verify-card { padding: 2rem 1.4rem; }
            .verify-student-name { font-size: 1.7rem; }
            .verify-status-large { font-size: 1.05rem; padding: 0.4rem 1.5rem; }
            .verify-time { font-size: 0.82rem; }
            .info-item { font-size: 0.78rem; padding: 0.5rem 0.7rem; flex-wrap: wrap; }
            .info-item-value { font-size: 0.85rem; max-width: 100%; }
            .verify-notes-content { font-size: 0.85rem; }
            .penalty-alert-value { font-size: 0.78rem; }
            .verify-behavior-details { font-size: 0.72rem; }
        }
    </style>
</head>
<body>
    <div class="verify-page">
        <div class="verify-card">
            <div class="school-icon"><i class="fas fa-graduation-cap"></i></div>
            <h2 class="school-title">ثانوية هوزان</h2>

            <div id="verificationContent">
                <div style="padding: 2rem 0;">
                    <div class="loading-spinner"><i class="fas fa-spinner"></i></div>
                    <div class="loading-text">جاري تحميل حالة الطالب...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://qnxiyrfdvqskwfcmnptw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_NV8m1fyVZq29VKBD6hQnsw_euvyzRsH';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        let rawStudent = urlParams.get('student');
        let studentName = null;

        if (rawStudent) {
            try {
                studentName = decodeURIComponent(rawStudent.trim());
            } catch (e) {
                studentName = rawStudent.trim();
            }
        }

        function normalize(text) {
            if (!text) return '';
            return String(text)
                .trim()
                .replace(/\s+/g, ' ')
                .replace(/^[A-Za-z]+\s+/, '')
                .replace(/[أإآا]/g, 'ا')
                .replace(/[ىي]/g, 'ي')
                .replace(/[ةه]/g, 'ه')
                .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
                .replace(/[^\u0600-\u06FF0-9\s]/g, '')
                .replace(/\s+/g, ' ')
                .trim()
                .toLowerCase();
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;')
                .replace(/\n/g, '<br>');
        }

        function getTimeSince(lastTime) {
            if (!lastTime) return null;
            const thenTime = new Date(lastTime).getTime();
            if (isNaN(thenTime)) return null;

            const nowTime = Date.now();
            let diffMs = nowTime - thenTime;
            if (diffMs < 0) {
                if (diffMs > -10800000) diffMs = Math.abs(diffMs + 10800000);
                else diffMs = 0;
            }
            const totalSec = Math.floor(diffMs / 1000);
            const days = Math.floor(totalSec / 86400);
            const hours = Math.floor(totalSec / 3600);
            const minutes = Math.floor(totalSec / 60);

            if (days > 0) {
                if (days === 1) return 'يوم واحد';
                if (days === 2) return 'يومين';
                if (days >= 3 && days <= 10) return `${days} أيام`;
                return `${days} يوماً`;
            }
            if (hours > 0) {
                if (hours === 1) return 'ساعة واحدة';
                if (hours === 2) return 'ساعتين';
                if (hours >= 3 && hours <= 10) return `${hours} ساعات`;
                return `${hours} ساعة`;
            }
            if (minutes > 0) {
                if (minutes === 1) return 'دقيقة واحدة';
                if (minutes === 2) return 'دقيقتين';
                if (minutes >= 3 && minutes <= 10) return `${minutes} دقائق`;
                return `${minutes} دقيقة`;
            }
            if (totalSec === 1) return 'ثانية واحدة';
            if (totalSec === 2) return 'ثانيتين';
            if (totalSec >= 3 && totalSec <= 10) return `${totalSec} ثوانٍ`;
            return `${totalSec} ثانية`;
        }

        function getRemainingTime(endsAt) {
            const endsTime = new Date(endsAt).getTime();
            if (isNaN(endsTime)) return null;
            const nowTime = Date.now();
            const diffMs = endsTime - nowTime;
            if (diffMs <= 0) return null;

            const totalSec = Math.floor(diffMs / 1000);
            const days = Math.floor(totalSec / 86400);
            const hours = Math.floor(totalSec / 3600);
            const minutes = Math.floor(totalSec / 60);

            if (days > 0) {
                if (days === 1) return 'يوم واحد';
                if (days === 2) return 'يومين';
                if (days >= 3 && days <= 10) return `${days} أيام`;
                return `${days} يوماً`;
            }
            if (hours > 0) {
                if (hours === 1) return 'ساعة واحدة';
                if (hours === 2) return 'ساعتين';
                if (hours >= 3 && hours <= 10) return `${hours} ساعات`;
                return `${hours} ساعة`;
            }
            if (minutes > 0) {
                if (minutes === 1) return 'دقيقة واحدة';
                if (minutes === 2) return 'دقيقتين';
                if (minutes >= 3 && minutes <= 10) return `${minutes} دقائق`;
                return `${minutes} دقيقة`;
            }
            return `${totalSec} ثانية`;
        }

        function getDurationText(durationType) {
            if (durationType === '2days') return 'يومين';
            if (durationType === 'week') return 'أسبوع';
            if (durationType === 'month') return 'شهر';
            if (durationType === '4months') return '4 أشهر';
            return '';
        }

        // ===== فحص انتهاء العقوبات تلقائياً =====
        async function autoExpirePenalties(studentName) {
            try {
                const { data: activePenalties } = await supabaseClient
                    .from('penalties')
                    .select('*')
                    .eq('student_name', studentName)
                    .eq('status', 'active');

                if (!activePenalties || activePenalties.length === 0) return;

                const now = new Date();
                const localNow = new Date(now.getTime() + (3 * 3600000));

                for (const penalty of activePenalties) {
                    const endsAt = new Date(penalty.ends_at);

                    if (endsAt <= localNow) {
                        // انتهت العقوبة → فك تلقائي
                        await supabaseClient
                            .from('penalties')
                            .update({ status: 'expired' })
                            .eq('id', penalty.id);

                        await supabaseClient
                            .from('students')
                            .update({
                                permitted: true,
                                last_permitted_at: localNow.toISOString()
                            })
                            .eq('name', studentName);

                        const timestamp = localNow.toLocaleString('en-US', {
                            month: 'short', day: 'numeric', year: 'numeric',
                            hour: '2-digit', minute: '2-digit', second: '2-digit',
                            hour12: false
                        });

                        await supabaseClient
                            .from('history')
                            .insert([{
                                student_name: studentName,
                                status: 'Penalty Expired',
                                timestamp: timestamp,
                                teacher: 'النظام (تلقائي)'
                            }]);
                    }
                }
            } catch (e) {
                console.error('Auto expire error:', e);
            }
        }

        async function loadStudentStatus() {
            const content = document.getElementById('verificationContent');

            if (!studentName) {
                content.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i> باركود غير صالح
                    </div>
                `;
                return;
            }

            try {
                // فحص العقوبات المنتهية أولاً
                await autoExpirePenalties(studentName);

                // جلب كل الطلاب
                const { data: allData, error: fetchErr } = await supabaseClient
                    .from('students')
                    .select('name, permitted, last_permitted_at, full_name, student_id, hijri_birth_date, notes');

                if (fetchErr) throw fetchErr;

                if (!allData || allData.length === 0) {
                    content.innerHTML = `
                        <div class="error-message">
                            <i class="fas fa-exclamation-triangle"></i> لا يوجد طلاب مسجلين
                        </div>
                    `;
                    return;
                }

                const target = normalize(studentName);

                let data =
                    allData.find(s => s.name === studentName) ||
                    allData.find(s => normalize(s.name) === target) ||
                    allData.find(s => normalize(s.name).includes(target)) ||
                    allData.find(s => target.includes(normalize(s.name)));

                if (!data) {
                    const firstWord = target.split(' ')[0];
                    if (firstWord.length >= 3) {
                        data = allData.find(s => normalize(s.name).startsWith(firstWord));
                    }
                }

                if (!data) {
                    const words = target.split(' ').filter(w => w.length >= 3);
                    for (const word of words) {
                        const found = allData.find(s => normalize(s.name).includes(word));
                        if (found) { data = found; break; }
                    }
                }

                if (!data) {
                    content.innerHTML = `
                        <div class="error-message">
                            <i class="fas fa-exclamation-triangle"></i> الطالب غير موجود
                        </div>
                        <p style="margin-top: 1rem; color: #8b7db8; font-size: 0.85rem;">
                            الباركود لا يتوافق مع أي طالب مسجل.
                        </p>
                        <div class="error-details">
                            <strong><i class="fas fa-barcode"></i> الاسم من الباركود:</strong>
                            <code>${escapeHtml(studentName)}</code>
                            <div style="margin-top: 0.7rem;">
                                <strong><i class="fas fa-list"></i> أسماء في النظام:</strong>
                                <div style="margin-top: 0.4rem;">
                                    ${allData.slice(0, 5).map(s => `<span class="name-chip">${escapeHtml(s.name)}</span>`).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                    return;
                }

                // جلب السلوكيات والعقوبات
                const [behaviorsRes, penaltiesRes] = await Promise.all([
                    supabaseClient
                        .from('behaviors')
                        .select('*')
                        .eq('student_name', data.name)
                        .order('created_at', { ascending: false }),
                    supabaseClient
                        .from('penalties')
                        .select('*')
                        .eq('student_name', data.name)
                        .order('started_at', { ascending: false })
                ]);

                const behaviors = behaviorsRes.data || [];
                const penalties = penaltiesRes.data || [];

                renderStatus(data, behaviors, penalties);

                // التحديث التلقائي كل 5 ثواني
                const refreshInterval = setInterval(async () => {
                    try {
                        await autoExpirePenalties(data.name);

                        const { data: refreshAll } = await supabaseClient
                            .from('students')
                            .select('name, permitted, last_permitted_at, full_name, student_id, hijri_birth_date, notes');

                        if (!refreshAll) return;
                        const refreshData = refreshAll.find(s => s.name === data.name);
                        if (refreshData) {
                            const [bR, pR] = await Promise.all([
                                supabaseClient.from('behaviors').select('*').eq('student_name', data.name).order('created_at', { ascending: false }),
                                supabaseClient.from('penalties').select('*').eq('student_name', data.name).order('started_at', { ascending: false })
                            ]);
                            renderStatus(refreshData, bR.data || [], pR.data || []);
                        }
                    } catch (e) {}
                }, 5000);

                window.addEventListener('beforeunload', () => {
                    clearInterval(refreshInterval);
                });

            } catch (error) {
                console.error('Load error:', error);
                content.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i> خطأ في الاتصال
                    </div>
                `;
            }
        }

        function renderStatus(data, behaviors, penalties) {
            const content = document.getElementById('verificationContent');

            // البحث عن عقوبة سارية
            const activePenalty = penalties.find(p => p.status === 'active');

            let penaltyHtml = '';

            if (activePenalty) {
                const remaining = getRemainingTime(activePenalty.ends_at);
                const endsAt = new Date(activePenalty.ends_at);
                const endDate = endsAt.toLocaleString('ar-SA', {
                    year: 'numeric', month: 'short', day: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });

                penaltyHtml = `
                    <div class="penalty-alert">
                        <div class="penalty-alert-header">
                            <div class="penalty-alert-icon">
                                <i class="fas fa-gavel"></i>
                            </div>
                            <div class="penalty-alert-title">
                                <strong>⚠️ الطالب معاقب حالياً</strong>
                                <span>مدة العقوبة: ${getDurationText(activePenalty.duration_type)}</span>
                            </div>
                        </div>
                        <div class="penalty-alert-info">
                            <div class="penalty-alert-row">
                                <span class="penalty-alert-label"><i class="fas fa-info-circle"></i> السبب</span>
                                <span class="penalty-alert-value">${escapeHtml(activePenalty.reason)}</span>
                            </div>
                            <div class="penalty-alert-row">
                                <span class="penalty-alert-label"><i class="fas fa-hourglass-half"></i> المتبقي</span>
                                <span class="penalty-alert-value highlight">${remaining || 'انتهت'}</span>
                            </div>
                            <div class="penalty-alert-row">
                                <span class="penalty-alert-label"><i class="fas fa-calendar-times"></i> ينتهي في</span>
                                <span class="penalty-alert-value">${endDate}</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            // حالة الأجهزة
            const devicesStatus = data.permitted;
            const devicesText = devicesStatus ? 'مسموح' : 'غير مسموح';
            const devicesClass = devicesStatus ? 'permitted' : 'not-permitted';
            const devicesIcon = devicesStatus ? '🟢' : '🔴';
            const devicesTime = data.last_permitted_at;

            let devicesTimeHtml = '';
            if (devicesStatus && devicesTime) {
                const timeStr = getTimeSince(devicesTime);
                if (timeStr) {
                    devicesTimeHtml = `
                        <div class="verify-time">
                            <i class="fas fa-clock"></i> مسموح بإحضار جهازه منذ ${timeStr}
                        </div>
                    `;
                }
            }

            // بيانات الطالب
            let infoHtml = '';
            if (data.full_name || data.hijri_birth_date || data.student_id) {
                let infoItems = '';
                if (data.full_name) {
                    infoItems += `
                        <div class="info-item">
                            <span class="info-item-label"><i class="fas fa-user"></i> الاسم الكامل</span>
                            <span class="info-item-value">${escapeHtml(data.full_name)}</span>
                        </div>
                    `;
                }
                if (data.student_id) {
                    infoItems += `
                        <div class="info-item">
                            <span class="info-item-label"><i class="fas fa-id-card"></i> رقم الهوية</span>
                            <span class="info-item-value">${escapeHtml(data.student_id)}</span>
                        </div>
                    `;
                }
                if (data.hijri_birth_date) {
                    infoItems += `
                        <div class="info-item">
                            <span class="info-item-label"><i class="fas fa-calendar-alt"></i> الميلاد الهجري</span>
                            <span class="info-item-value">${escapeHtml(data.hijri_birth_date)}</span>
                        </div>
                    `;
                }
                infoHtml = `
                    <div class="verify-info-section">
                        <div class="verify-section-title">
                            <i class="fas fa-id-card"></i> بيانات الطالب
                        </div>
                        ${infoItems}
                    </div>
                `;
            }

            // الملاحظات
            let notesHtml = '';
            if (data.notes && data.notes.trim()) {
                notesHtml = `
                    <div class="verify-notes-section">
                        <div class="verify-notes-title">
                            <i class="fas fa-sticky-note"></i> ملاحظات
                        </div>
                        <div class="verify-notes-content">${escapeHtml(data.notes)}</div>
                    </div>
                `;
            }

            // سجل السلوكيات
            let behaviorsHtml = '';
            if (behaviors && behaviors.length > 0) {
                const positiveCount = behaviors.filter(b => b.type === 'positive').length;
                const negativeCount = behaviors.filter(b => b.type === 'negative').length;

                let behaviorItems = '';
                behaviors.slice(0, 20).forEach(item => {
                    const isPositive = item.type === 'positive';
                    const icon = isPositive ? '⭐' : '⚠️';
                    const label = isPositive ? 'مشاركة' : 'مخالفة';
                    const cls = isPositive ? 'positive' : 'negative';

                    const dateStr = new Date(item.created_at).toLocaleString('ar-SA', {
                        year: 'numeric', month: 'short', day: 'numeric',
                        hour: '2-digit', minute: '2-digit'
                    });

                    behaviorItems += `
                        <div class="verify-behavior-item ${cls}">
                            <div class="verify-behavior-icon">
                                <i class="fas ${isPositive ? 'fa-star' : 'fa-exclamation-triangle'}"></i>
                            </div>
                            <div class="verify-behavior-content">
                                <div class="verify-behavior-header">
                                    <span class="verify-behavior-type">${icon} ${label}</span>
                                    <span class="verify-behavior-date">${dateStr}</span>
                                </div>
                                ${item.category ? `<div class="verify-behavior-category"><i class="fas fa-tag"></i> ${escapeHtml(item.category)}</div>` : ''}
                                <div class="verify-behavior-details">${escapeHtml(item.details)}</div>
                            </div>
                        </div>
                    `;
                });

                behaviorsHtml = `
                    <div class="verify-behaviors-section">
                        <div class="verify-behaviors-header">
                            <div class="verify-behaviors-header-title">
                                <i class="fas fa-clipboard-check"></i>
                                السجل السلوكي
                            </div>
                            <div class="verify-behaviors-stats">
                                <span class="verify-stat-mini positive">⭐ ${positiveCount}</span>
                                <span class="verify-stat-mini negative">⚠️ ${negativeCount}</span>
                            </div>
                        </div>
                        <div class="verify-behaviors-list">
                            ${behaviorItems}
                        </div>
                    </div>
                `;
            }

            content.innerHTML = `
                ${penaltyHtml}

                <div class="verify-student-name">${escapeHtml(data.name)}</div>

                <div class="verify-section">
                    <div class="verify-section-title">
                        <i class="fas fa-mobile-alt"></i> إحضار الأجهزة
                    </div>
                    <div class="verify-status-large ${devicesClass}">${devicesIcon} ${devicesText}</div>
                    ${devicesTimeHtml}
                </div>

                ${infoHtml}
                ${notesHtml}
                ${behaviorsHtml}

                <div class="verify-timestamp">
                    <i class="fas fa-check-circle"></i>
                    تم التحديث بواسطة: محمد ماهر او عبدالله العوض
                </div>
                <div class="refresh-indicator">
                    <i class="fas fa-sync-alt"></i>
                    يتم التحديث تلقائياً
                </div>
            `;
        }

        loadStudentStatus();
    </script>
</body>
</html>
