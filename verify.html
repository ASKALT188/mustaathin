<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>التحقق من الطالب · ثانوية هوزان</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        .verify-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            padding: 1.5rem;
        }
        .verify-card {
            background: white;
            border-radius: 40px;
            padding: 3rem 2.5rem;
            max-width: 550px;
            width: 100%;
            text-align: center;
            border: 2px solid #ede4ff;
            box-shadow: 0 12px 40px rgba(124, 58, 237, 0.08);
        }
        .verify-card .school-icon {
            font-size: 2.5rem;
            color: #7c3aed;
            margin-bottom: 0.5rem;
        }
        .verify-card h2 {
            color: #4c1d95;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        .verify-student-name {
            font-size: 2.4rem;
            font-weight: 700;
            color: #3b1e6b;
            margin: 1rem 0 0.5rem;
            word-break: break-word;
        }
        .verify-section {
            margin: 1rem 0;
            padding: 1rem;
            border-radius: 20px;
            background: #fbf9ff;
            border: 2px solid #f3ecff;
        }
        .verify-section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #6b5b95;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }
        .verify-status-large {
            display: inline-block;
            padding: 0.6rem 2.5rem;
            border-radius: 60px;
            font-size: 1.4rem;
            font-weight: 700;
            margin: 0.3rem 0;
        }
        .verify-status-large.permitted {
            background: #d3f0e5;
            color: #006b4e;
        }
        .verify-status-large.not-permitted {
            background: #fce8e8;
            color: #b13e3e;
        }
        .verify-time {
            color: #3b1e6b;
            font-size: 0.95rem;
            font-weight: 700;
            margin-top: 0.6rem;
            padding: 0.5rem;
            background: #f7f3ff;
            border-radius: 12px;
            border: 2px solid #ede4ff;
        }
        .verify-time i { color: #7c3aed; margin-left: 0.5rem; }
        .verify-timestamp {
            color: #8b7db8;
            font-size: 0.8rem;
            margin-top: 1.5rem;
        }
        .refresh-indicator {
            color: #a78bfa;
            font-size: 0.7rem;
            margin-top: 0.5rem;
            opacity: 0.8;
        }
        .loading-spinner {
            font-size: 2rem;
            color: #7c3aed;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-message {
            color: #b13e3e;
            font-size: 1rem;
            padding: 1rem;
            background: #fce8e8;
            border-radius: 16px;
        }
        @media (max-width: 500px) {
            .verify-card { padding: 2rem 1.5rem; }
            .verify-student-name { font-size: 1.8rem; }
            .verify-status-large { font-size: 1.1rem; padding: 0.4rem 1.8rem; }
            .verify-time { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="verify-page">
        <div class="verify-card" id="verifyCard">
            <div class="school-icon"><i class="fas fa-graduation-cap"></i></div>
            <h2>ثانوية هوزان</h2>

            <div id="verificationContent">
                <div class="loading-spinner"><i class="fas fa-spinner"></i></div>
                <p style="margin-top: 1rem; color: #8b7db8;">جاري تحميل حالة الطالب...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://qnxiyrfdvqskwfcmnptw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_NV8m1fyVZq29VKBD6hQnsw_euvyzRsH';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        let rawStudent = urlParams.get('student');
        let studentName = null;

        if (rawStudent) {
            try {
                studentName = decodeURIComponent(rawStudent.trim());
            } catch (e) {
                studentName = rawStudent.trim();
            }
        }

        function getTimeSince(lastTime) {
            if (!lastTime) return null;
            
            const thenTime = new Date(lastTime).getTime();
            if (isNaN(thenTime)) return null;

            const nowTime = Date.now();
            let diffMs = nowTime - thenTime;

            if (diffMs < 0) {
                if (diffMs > -10800000) {
                    diffMs = Math.abs(diffMs + 10800000);
                } else {
                    diffMs = 0;
                }
            }

            const totalSec = Math.floor(diffMs / 1000);
            const days = Math.floor(totalSec / 86400);
            const hours = Math.floor(totalSec / 3600);
            const minutes = Math.floor(totalSec / 60);

            if (days > 0) {
                if (days === 1) return 'يوم واحد';
                if (days === 2) return 'يومين';
                if (days >= 3 && days <= 10) return `${days} أيام`;
                return `${days} يوماً`;
            }
            if (hours > 0) {
                if (hours === 1) return 'ساعة واحدة';
                if (hours === 2) return 'ساعتين';
                if (hours >= 3 && hours <= 10) return `${hours} ساعات`;
                return `${hours} ساعة`;
            }
            if (minutes > 0) {
                if (minutes === 1) return 'دقيقة واحدة';
                if (minutes === 2) return 'دقيقتين';
                if (minutes >= 3 && minutes <= 10) return `${minutes} دقائق`;
                return `${minutes} دقيقة`;
            }
            
            if (totalSec === 1) return 'ثانية واحدة';
            if (totalSec === 2) return 'ثانيتين';
            if (totalSec >= 3 && totalSec <= 10) return `${totalSec} ثوانٍ`;
            return `${totalSec} ثانية`;
        }

        let timeIntervalDevices = null;
        let timeIntervalIstiathan = null;
        let lastDevicesTime = null;
        let lastIstiathanTime = null;

        function updateTimerDevices() {
            const timeEl = document.getElementById('timeDisplayDevices');
            if (!timeEl || !lastDevicesTime) return;
            const timeStr = getTimeSince(lastDevicesTime);
            if (timeStr) {
                timeEl.innerHTML = `<i class="fas fa-clock"></i> مسموح بإحضار جهازه منذ ${timeStr}`;
            }
        }

        function updateTimerIstiathan() {
            const timeEl = document.getElementById('timeDisplayIstiathan');
            if (!timeEl || !lastIstiathanTime) return;
            const timeStr = getTimeSince(lastIstiathanTime);
            if (timeStr) {
                timeEl.innerHTML = `<i class="fas fa-clock"></i> مستأذن منذ ${timeStr}`;
            }
        }

        async function loadStudentStatus() {
            const content = document.getElementById('verificationContent');

            if (!studentName) {
                content.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i> باركود غير صالح
                    </div>
                `;
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('students')
                    .select('name, permitted, last_permitted_at, istiathan_permitted, last_istiathan_at')
                    .eq('name', studentName)
                    .single();

                if (error || !data) {
                    content.innerHTML = `
                        <div class="error-message">
                            <i class="fas fa-exclamation-triangle"></i> الطالب غير موجود
                        </div>
                        <p style="margin-top: 1rem; color: #8b7db8; font-size: 0.9rem;">
                            الباركود لا يتوافق مع أي طالب مسجل (${studentName}).
                        </p>
                    `;
                    return;
                }

                renderStatus(data);

                const refreshInterval = setInterval(async () => {
                    try {
                        const { data: refreshData, error: refreshError } = await supabaseClient
                            .from('students')
                            .select('name, permitted, last_permitted_at, istiathan_permitted, last_istiathan_at')
                            .eq('name', studentName)
                            .single();

                        if (!refreshError && refreshData) {
                            renderStatus(refreshData);
                        }
                    } catch (e) {}
                }, 5000);

                window.addEventListener('beforeunload', () => {
                    clearInterval(refreshInterval);
                    if (timeIntervalDevices) clearInterval(timeIntervalDevices);
                    if (timeIntervalIstiathan) clearInterval(timeIntervalIstiathan);
                });

            } catch (error) {
                content.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i> خطأ في الاتصال
                    </div>
                `;
            }
        }

        function renderStatus(data) {
            const content = document.getElementById('verificationContent');

            const devicesStatus = data.permitted;
            const devicesText = devicesStatus ? 'مسموح' : 'غير مسموح';
            const devicesClass = devicesStatus ? 'permitted' : 'not-permitted';
            const devicesIcon = devicesStatus ? '🟢' : '🔴';
            const devicesTime = data.last_permitted_at;

            const istiathanStatus = data.istiathan_permitted;
            const istiathanText = istiathanStatus ? 'مسموح' : 'غير مسموح';
            const istiathanClass = istiathanStatus ? 'permitted' : 'not-permitted';
            const istiathanIcon = istiathanStatus ? '🟢' : '🔴';
            const istiathanTime = data.last_istiathan_at;

            let devicesTimeHtml = '';
            if (devicesStatus && devicesTime) {
                const timeStr = getTimeSince(devicesTime);
                devicesTimeHtml = `
                    <div class="verify-time" id="timeDisplayDevices">
                        <i class="fas fa-clock"></i> مسموح بإحضار جهازه منذ ${timeStr}
                    </div>
                `;
            }

            let istiathanTimeHtml = '';
            if (istiathanStatus && istiathanTime) {
                const timeStr = getTimeSince(istiathanTime);
                istiathanTimeHtml = `
                    <div class="verify-time" id="timeDisplayIstiathan">
                        <i class="fas fa-clock"></i> مستأذن منذ ${timeStr}
                    </div>
                `;
            }

            content.innerHTML = `
                <div class="verify-student-name">${data.name}</div>

                <div class="verify-section">
                    <div class="verify-section-title">
                        <i class="fas fa-mobile-alt"></i>
                        إحضار الأجهزة
                    </div>
                    <div class="verify-status-large ${devicesClass}">${devicesIcon} ${devicesText}</div>
                    ${devicesTimeHtml}
                </div>

                <div class="verify-section">
                    <div class="verify-section-title">
                        <i class="fas fa-user-clock"></i>
                        الاستئذان
                    </div>
                    <div class="verify-status-large ${istiathanClass}">${istiathanIcon} ${istiathanText}</div>
                    ${istiathanTimeHtml}
                </div>

                <div class="verify-timestamp">
                    <i class="fas fa-check-circle"></i> تم التحديث بواسطة: محمد ماهر او عبدالله العوض
                </div>
                <div class="refresh-indicator">
                    <i class="fas fa-sync-alt fa-fw"></i> يتم التحديث تلقائياً
                </div>
            `;

            // تشغيل العدادات
            lastDevicesTime = devicesTime;
            lastIstiathanTime = istiathanTime;

            if (timeIntervalDevices) clearInterval(timeIntervalDevices);
            if (timeIntervalIstiathan) clearInterval(timeIntervalIstiathan);

            if (devicesStatus && devicesTime) {
                timeIntervalDevices = setInterval(updateTimerDevices, 1000);
            }
            if (istiathanStatus && istiathanTime) {
                timeIntervalIstiathan = setInterval(updateTimerIstiathan, 1000);
            }
        }

        loadStudentStatus();
    </script>
</body>
</html>
