<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>التحقق من الطالب · Musta'athin</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        .verify-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            padding: 1.5rem;
        }
        .verify-card {
            background: white;
            border-radius: 40px;
            padding: 3rem 2.5rem;
            max-width: 550px;
            width: 100%;
            text-align: center;
            border: 2px solid #ede4ff;
            box-shadow: 0 12px 40px rgba(124, 58, 237, 0.08);
        }
        .verify-card .school-icon {
            font-size: 2.5rem;
            color: #7c3aed;
            margin-bottom: 0.5rem;
        }
        .verify-card h2 {
            color: #4c1d95;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        .verify-student-name {
            font-size: 2.8rem;
            font-weight: 700;
            color: #3b1e6b;
            margin: 1rem 0 0.5rem;
        }
        .verify-status-large {
            display: inline-block;
            padding: 0.6rem 2.5rem;
            border-radius: 60px;
            font-size: 1.6rem;
            font-weight: 700;
            margin: 1rem 0 0.5rem;
        }
        .verify-status-large.permitted {
            background: #d3f0e5;
            color: #006b4e;
        }
        .verify-status-large.not-permitted {
            background: #fce8e8;
            color: #b13e3e;
        }
        .verify-time {
            color: #3b1e6b;
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: #f7f3ff;
            border-radius: 16px;
            border: 2px solid #ede4ff;
        }
        .verify-time i { color: #7c3aed; margin-left: 0.5rem; }
        .verify-timestamp {
            color: #8b7db8;
            font-size: 0.8rem;
            margin-top: 1.5rem;
        }
        .refresh-indicator {
            color: #a78bfa;
            font-size: 0.7rem;
            margin-top: 0.5rem;
            opacity: 0.8;
        }
        .loading-spinner {
            font-size: 2rem;
            color: #7c3aed;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-message {
            color: #b13e3e;
            font-size: 1rem;
            padding: 1rem;
            background: #fce8e8;
            border-radius: 16px;
        }
        @media (max-width: 500px) {
            .verify-card { padding: 2rem 1.5rem; }
            .verify-student-name { font-size: 2rem; }
            .verify-status-large { font-size: 1.2rem; padding: 0.4rem 1.8rem; }
            .verify-time { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="verify-page">
        <div class="verify-card" id="verifyCard">
            <div class="school-icon"><i class="fas fa-graduation-cap"></i></div>
            <h2>Hawazen High School</h2>

            <div id="verificationContent">
                <div class="loading-spinner"><i class="fas fa-spinner"></i></div>
                <p style="margin-top: 1rem; color: #8b7db8;">جاري تحميل حالة الطالب...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://qnxiyrfdvqskwfcmnptw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_NV8m1fyVZq29VKBD6hQnsw_euvyzRsH';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const studentName = urlParams.get('student');

        function getTimeSince(lastPermittedAt) {
            if (!lastPermittedAt) return null;
            const now = new Date();
            const localNow = new Date(now.getTime() + (3 * 3600000));
            const then = new Date(lastPermittedAt);
            const localThen = new Date(then.getTime() + (3 * 3600000));
            const diffMs = localNow - localThen;
            const diffSec = Math.floor(diffMs / 1000);
            const diffMin = Math.floor(diffSec / 60);
            const diffHours = Math.floor(diffMin / 60);
            const diffDays = Math.floor(diffHours / 24);
            if (diffDays > 0) return `${diffDays} يوم ${diffHours % 24} ساعة`;
            if (diffHours > 0) return `${diffHours} ساعة ${diffMin % 60} دقيقة`;
            if (diffMin > 0) return `${diffMin} دقيقة ${diffSec % 60} ثانية`;
            return `${diffSec} ثانية`;
        }

        let timeInterval = null;

        function updateTimer(lastPermittedAt) {
            const timeEl = document.getElementById('timeDisplay');
            if (!timeEl || !lastPermittedAt) return;
            const timeStr = getTimeSince(lastPermittedAt);
            if (timeStr) {
                timeEl.innerHTML = `<i class="fas fa-clock"></i> مستأذن منذ ${timeStr}`;
            }
        }

        async function loadStudentStatus() {
            const content = document.getElementById('verificationContent');

            if (!studentName) {
                content.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i> باركود غير صالح
                    </div>
                `;
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('students')
                    .select('name, permitted, last_permitted_at')
                    .eq('name', studentName)
                    .single();

                if (error || !data) {
                    content.innerHTML = `
                        <div class="error-message">
                            <i class="fas fa-exclamation-triangle"></i> الطالب غير موجود
                        </div>
                        <p style="margin-top: 1rem; color: #8b7db8; font-size: 0.9rem;">
                            الباركود لا يتوافق مع أي طالب مسجل.
                        </p>
                    `;
                    return;
                }

                renderStatus(data);

                const refreshInterval = setInterval(async () => {
                    try {
                        const { data: refreshData, error: refreshError } = await supabaseClient
                            .from('students')
                            .select('name, permitted, last_permitted_at')
                            .eq('name', studentName)
                            .single();

                        if (!refreshError && refreshData) {
                            renderStatus(refreshData);
                        }
                    } catch (e) {}
                }, 5000);

                window.addEventListener('beforeunload', () => {
                    clearInterval(refreshInterval);
                    if (timeInterval) clearInterval(timeInterval);
                });

            } catch (error) {
                content.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i> خطأ في الاتصال
                    </div>
                `;
            }
        }

        function renderStatus(data) {
            const content = document.getElementById('verificationContent');
            const status = data.permitted;
            const statusText = status ? 'مسموح' : 'غير مسموح';
            const statusClass = status ? 'permitted' : 'not-permitted';
            const statusIcon = status ? '🟢' : '🔴';
            const lastPermittedAt = data.last_permitted_at;

            let timeHtml = '';
            if (status && lastPermittedAt) {
                const timeStr = getTimeSince(lastPermittedAt);
                timeHtml = `
                    <div class="verify-time" id="timeDisplay">
                        <i class="fas fa-clock"></i> مسموح بحضار جهازه منذ ${timeStr}
                    </div>
                `;
            }

            content.innerHTML = `
                <div class="verify-student-name">${data.name}</div>
                <div class="verify-status-large ${statusClass}">${statusIcon} ${statusText}</div>
                ${timeHtml}
                <div class="verify-timestamp">
                    <i class="fas fa-check-circle"></i> تم التحديث بواسطة: محمد ماهر
                </div>
                <div class="refresh-indicator">
                    <i class="fas fa-sync-alt fa-fw"></i> يتم التحديث تلقائياً
                </div>
            `;

            if (status && lastPermittedAt) {
                if (timeInterval) clearInterval(timeInterval);
                timeInterval = setInterval(() => updateTimer(lastPermittedAt), 1000);
            } else {
                if (timeInterval) clearInterval(timeInterval);
            }
        }

        loadStudentStatus();
    </script>
</body>
</html>
