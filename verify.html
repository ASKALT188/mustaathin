<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>التحقق من الطالب · ثانوية هوزان</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', 'Inter', -apple-system, system-ui, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            color: #2a1e4a;
        }

        .verify-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .verify-card {
            background: white;
            border-radius: 32px;
            padding: 2.5rem 2rem;
            max-width: 540px;
            width: 100%;
            text-align: center;
            border: 2px solid #ede4ff;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.06);
        }

        /* ===== رأس البطاقة ===== */
        .school-icon {
            font-size: 2.5rem;
            color: #7c3aed;
            margin-bottom: 0.5rem;
        }

        .school-title {
            color: #4c1d95;
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* ===== اسم الطالب ===== */
        .verify-student-name {
            font-size: 2.2rem;
            font-weight: 700;
            color: #3b1e6b;
            margin: 1.5rem 0 1rem;
            word-break: break-word;
        }

        /* ===== حالة الأجهزة والاستئذان (تحت بعض) ===== */
        .verify-section {
            margin: 1rem 0;
            padding: 1rem;
            border-radius: 20px;
            background: #fbf9ff;
            border: 2px solid #f3ecff;
        }

        .verify-section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #6b5b95;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .verify-status-large {
            display: inline-block;
            padding: 0.5rem 2rem;
            border-radius: 60px;
            font-size: 1.3rem;
            font-weight: 700;
            margin: 0.3rem 0;
        }

        .verify-status-large.permitted {
            background: #d3f0e5;
            color: #006b4e;
        }

        .verify-status-large.not-permitted {
            background: #fce8e8;
            color: #b13e3e;
        }

        .verify-time {
            color: #3b1e6b;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 0.6rem;
            padding: 0.4rem 0.8rem;
            background: #f7f3ff;
            border-radius: 12px;
            border: 1px solid #ede4ff;
            display: inline-block;
        }

        .verify-time i {
            color: #7c3aed;
            margin-left: 0.4rem;
            font-size: 0.8rem;
        }

        /* ===== معلومات الطالب ===== */
        .verify-info-section {
            background: #f7f3ff;
            border: 2px solid #ede4ff;
            border-radius: 20px;
            padding: 1rem;
            margin: 1rem 0;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0.8rem;
            background: white;
            border-radius: 12px;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            gap: 0.5rem;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .info-item-label {
            color: #6b5b95;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .info-item-label i {
            color: #a78bfa;
            font-size: 0.8rem;
        }

        .info-item-value {
            color: #3b1e6b;
            font-weight: 700;
            background: #f7f3ff;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            border: 1px solid #ede4ff;
            direction: ltr;
        }

        /* ===== الملاحظات ===== */
        .verify-notes-section {
            background: #fffbeb;
            border: 2px solid #fde68a;
            border-radius: 20px;
            padding: 1rem;
            margin: 1rem 0;
            text-align: right;
        }

        .verify-notes-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #b45309;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .verify-notes-title i {
            color: #d97706;
        }

        .verify-notes-content {
            background: white;
            border-radius: 12px;
            padding: 0.8rem 1rem;
            color: #3b1e6b;
            font-size: 0.9rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: 1px solid #fef3c7;
        }

        /* ===== ذيل البطاقة ===== */
        .verify-timestamp {
            color: #8b7db8;
            font-size: 0.75rem;
            margin-top: 1.5rem;
        }

        .verify-timestamp i {
            color: #7c3aed;
            margin-left: 0.3rem;
        }

        .refresh-indicator {
            color: #a78bfa;
            font-size: 0.7rem;
            margin-top: 0.4rem;
            opacity: 0.8;
        }

        /* ===== التحميل ===== */
        .loading-spinner {
            font-size: 2rem;
            color: #7c3aed;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #8b7db8;
            font-size: 0.9rem;
            margin-top: 1rem;
        }

        /* ===== الأخطاء ===== */
        .error-message {
            color: #b13e3e;
            font-size: 1rem;
            padding: 1rem;
            background: #fce8e8;
            border-radius: 16px;
            border: 1px solid #f5d0d0;
        }

        .error-details {
            margin-top: 1rem;
            padding: 0.9rem;
            background: #f7f3ff;
            border-radius: 12px;
            font-size: 0.75rem;
            color: #6b5b95;
            text-align: right;
            border: 1px solid #ede4ff;
        }

        .error-details strong {
            color: #4c1d95;
            display: block;
            margin-bottom: 0.4rem;
        }

        .error-details code {
            direction: ltr;
            display: inline-block;
            background: white;
            padding: 0.3rem 0.7rem;
            border-radius: 8px;
            word-break: break-all;
            border: 1px solid #ede4ff;
            color: #b13e3e;
            font-weight: 600;
        }

        .error-details .name-chip {
            display: inline-block;
            background: white;
            padding: 0.2rem 0.6rem;
            border-radius: 8px;
            margin: 0.15rem;
            border: 1px solid #ede4ff;
            color: #3b1e6b;
            font-weight: 600;
        }

        /* ===== الجوال ===== */
        @media (max-width: 500px) {
            .verify-card {
                padding: 2rem 1.4rem;
                border-radius: 28px;
            }
            .verify-student-name {
                font-size: 1.7rem;
            }
            .verify-status-large {
                font-size: 1.05rem;
                padding: 0.4rem 1.5rem;
            }
            .verify-time {
                font-size: 0.82rem;
            }
            .info-item {
                font-size: 0.78rem;
                padding: 0.45rem 0.7rem;
            }
            .info-item-value {
                font-size: 0.85rem;
                padding: 0.15rem 0.6rem;
            }
            .verify-notes-content {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="verify-page">
        <div class="verify-card" id="verifyCard">

            <div class="school-icon"><i class="fas fa-graduation-cap"></i></div>
            <h2 class="school-title">ثانوية هوزان</h2>

            <div id="verificationContent">
                <div style="padding: 2rem 0;">
                    <div class="loading-spinner"><i class="fas fa-spinner"></i></div>
                    <div class="loading-text">جاري تحميل حالة الطالب...</div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://qnxiyrfdvqskwfcmnptw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_NV8m1fyVZq29VKBD6hQnsw_euvyzRsH';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ===== استخراج اسم الطالب =====
        const urlParams = new URLSearchParams(window.location.search);
        let rawStudent = urlParams.get('student');
        let studentName = null;

        if (rawStudent) {
            try {
                studentName = decodeURIComponent(rawStudent.trim());
            } catch (e) {
                studentName = rawStudent.trim();
            }
        }

        // ===== تطبيع النص =====
        function normalize(text) {
            if (!text) return '';
            return String(text)
                .trim()
                .replace(/\s+/g, ' ')
                .replace(/^[A-Za-z]+\s+/, '')
                .replace(/[أإآا]/g, 'ا')
                .replace(/[ىي]/g, 'ي')
                .replace(/[ةه]/g, 'ه')
                .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
                .replace(/[^\u0600-\u06FF0-9\s]/g, '')
                .replace(/\s+/g, ' ')
                .trim()
                .toLowerCase();
        }

        // ===== حساب المدة =====
        function getTimeSince(lastTime) {
            if (!lastTime) return null;

            const thenTime = new Date(lastTime).getTime();
            if (isNaN(thenTime)) return null;

            const nowTime = Date.now();
            let diffMs = nowTime - thenTime;

            if (diffMs < 0) {
                if (diffMs > -10800000) {
                    diffMs = Math.abs(diffMs + 10800000);
                } else {
                    diffMs = 0;
                }
            }

            const totalSec = Math.floor(diffMs / 1000);
            const days = Math.floor(totalSec / 86400);
            const hours = Math.floor(totalSec / 3600);
            const minutes = Math.floor(totalSec / 60);

            if (days > 0) {
                if (days === 1) return 'يوم واحد';
                if (days === 2) return 'يومين';
                if (days >= 3 && days <= 10) return `${days} أيام`;
                return `${days} يوماً`;
            }
            if (hours > 0) {
                if (hours === 1) return 'ساعة واحدة';
                if (hours === 2) return 'ساعتين';
                if (hours >= 3 && hours <= 10) return `${hours} ساعات`;
                return `${hours} ساعة`;
            }
            if (minutes > 0) {
                if (minutes === 1) return 'دقيقة واحدة';
                if (minutes === 2) return 'دقيقتين';
                if (minutes >= 3 && minutes <= 10) return `${minutes} دقائق`;
                return `${minutes} دقيقة`;
            }
            if (totalSec === 1) return 'ثانية واحدة';
            if (totalSec === 2) return 'ثانيتين';
            if (totalSec >= 3 && totalSec <= 10) return `${totalSec} ثوانٍ`;
            return `${totalSec} ثانية`;
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;')
                .replace(/\n/g, '<br>');
        }

        let timeIntervalDevices = null;
        let timeIntervalIstiathan = null;
        let lastDevicesTime = null;
        let lastIstiathanTime = null;

        function updateTimerDevices() {
            const timeEl = document.getElementById('timeDisplayDevices');
            if (!timeEl || !lastDevicesTime) return;
            const timeStr = getTimeSince(lastDevicesTime);
            if (timeStr) {
                timeEl.innerHTML = `<i class="fas fa-clock"></i> مسموح بإحضار جهازه منذ ${timeStr}`;
            }
        }

        function updateTimerIstiathan() {
            const timeEl = document.getElementById('timeDisplayIstiathan');
            if (!timeEl || !lastIstiathanTime) return;
            const timeStr = getTimeSince(lastIstiathanTime);
            if (timeStr) {
                timeEl.innerHTML = `<i class="fas fa-clock"></i> مستأذن منذ ${timeStr}`;
            }
        }

        // ===== تحميل الحالة =====
        async function loadStudentStatus() {
            const content = document.getElementById('verificationContent');

            if (!studentName) {
                content.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i> باركود غير صالح
                    </div>
                    <p style="margin-top: 1rem; color: #8b7db8; font-size: 0.85rem;">
                        لم يتم العثور على اسم الطالب في الرابط.
                    </p>
                `;
                return;
            }

            try {
                const { data: allData, error: fetchErr } = await supabaseClient
                    .from('students')
                    .select('name, permitted, last_permitted_at, istiathan_permitted, last_istiathan_at, hijri_birth_date, student_id, notes');

                if (fetchErr) throw fetchErr;

                if (!allData || allData.length === 0) {
                    content.innerHTML = `
                        <div class="error-message">
                            <i class="fas fa-exclamation-triangle"></i> لا يوجد طلاب مسجلين
                        </div>
                    `;
                    return;
                }

                const target = normalize(studentName);

                let data =
                    allData.find(s => s.name === studentName) ||
                    allData.find(s => normalize(s.name) === target) ||
                    allData.find(s => normalize(s.name).includes(target)) ||
                    allData.find(s => target.includes(normalize(s.name)));

                if (!data) {
                    const firstWord = target.split(' ')[0];
                    if (firstWord.length >= 3) {
                        data = allData.find(s => normalize(s.name).startsWith(firstWord));
                    }
                }

                if (!data) {
                    const words = target.split(' ').filter(w => w.length >= 3);
                    for (const word of words) {
                        const found = allData.find(s => normalize(s.name).includes(word));
                        if (found) { data = found; break; }
                    }
                }

                if (!data) {
                    content.innerHTML = `
                        <div class="error-message">
                            <i class="fas fa-exclamation-triangle"></i> الطالب غير موجود
                        </div>
                        <p style="margin-top: 1rem; color: #8b7db8; font-size: 0.85rem;">
                            الباركود لا يتوافق مع أي طالب مسجل.
                        </p>
                        <div class="error-details">
                            <strong><i class="fas fa-barcode"></i> الاسم من الباركود:</strong>
                            <code>${escapeHtml(studentName)}</code>
                            <div style="margin-top: 0.7rem;">
                                <strong><i class="fas fa-list"></i> أسماء في النظام:</strong>
                                <div style="margin-top: 0.4rem;">
                                    ${allData.slice(0, 5).map(s => `<span class="name-chip">${escapeHtml(s.name)}</span>`).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                    return;
                }

                renderStatus(data);

                const refreshInterval = setInterval(async () => {
                    try {
                        const { data: refreshAll } = await supabaseClient
                            .from('students')
                            .select('name, permitted, last_permitted_at, istiathan_permitted, last_istiathan_at, hijri_birth_date, student_id, notes');

                        if (!refreshAll) return;
                        const refreshData = refreshAll.find(s => s.name === data.name);
                        if (refreshData) renderStatus(refreshData);
                    } catch (e) {}
                }, 5000);

                window.addEventListener('beforeunload', () => {
                    clearInterval(refreshInterval);
                    if (timeIntervalDevices) clearInterval(timeIntervalDevices);
                    if (timeIntervalIstiathan) clearInterval(timeIntervalIstiathan);
                });

            } catch (error) {
                console.error('Load error:', error);
                content.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i> خطأ في الاتصال
                    </div>
                `;
            }
        }

        // ===== عرض الحالة =====
        function renderStatus(data) {
            const content = document.getElementById('verificationContent');

            const devicesStatus = data.permitted;
            const devicesText = devicesStatus ? 'مسموح' : 'غير مسموح';
            const devicesClass = devicesStatus ? 'permitted' : 'not-permitted';
            const devicesIcon = devicesStatus ? '🟢' : '🔴';
            const devicesTime = data.last_permitted_at;

            const istiathanStatus = data.istiathan_permitted;
            const istiathanText = istiathanStatus ? 'مسموح' : 'غير مسموح';
            const istiathanClass = istiathanStatus ? 'permitted' : 'not-permitted';
            const istiathanIcon = istiathanStatus ? '🟢' : '🔴';
            const istiathanTime = data.last_istiathan_at;

            let devicesTimeHtml = '';
            if (devicesStatus && devicesTime) {
                const timeStr = getTimeSince(devicesTime);
                if (timeStr) {
                    devicesTimeHtml = `
                        <div class="verify-time" id="timeDisplayDevices">
                            <i class="fas fa-clock"></i> مسموح بإحضار جهازه منذ ${timeStr}
                        </div>
                    `;
                }
            }

            let istiathanTimeHtml = '';
            if (istiathanStatus && istiathanTime) {
                const timeStr = getTimeSince(istiathanTime);
                if (timeStr) {
                    istiathanTimeHtml = `
                        <div class="verify-time" id="timeDisplayIstiathan">
                            <i class="fas fa-clock"></i> مستأذن منذ ${timeStr}
                        </div>
                    `;
                }
            }

            // معلومات الطالب
            let infoHtml = '';
            if (data.hijri_birth_date || data.student_id) {
                let infoItems = '';
                if (data.hijri_birth_date) {
                    infoItems += `
                        <div class="info-item">
                            <span class="info-item-label">
                                <i class="fas fa-calendar-alt"></i>
                                تاريخ الميلاد الهجري
                            </span>
                            <span class="info-item-value">${escapeHtml(data.hijri_birth_date)}</span>
                        </div>
                    `;
                }
                if (data.student_id) {
                    infoItems += `
                        <div class="info-item">
                            <span class="info-item-label">
                                <i class="fas fa-id-card"></i>
                                رقم الهوية
                            </span>
                            <span class="info-item-value">${escapeHtml(data.student_id)}</span>
                        </div>
                    `;
                }
                infoHtml = `
                    <div class="verify-info-section">
                        <div class="verify-section-title">
                            <i class="fas fa-id-card"></i>
                            معلومات الطالب
                        </div>
                        ${infoItems}
                    </div>
                `;
            }

            // الملاحظات
            let notesHtml = '';
            if (data.notes && data.notes.trim()) {
                notesHtml = `
                    <div class="verify-notes-section">
                        <div class="verify-notes-title">
                            <i class="fas fa-sticky-note"></i>
                            ملاحظات
                        </div>
                        <div class="verify-notes-content">${escapeHtml(data.notes)}</div>
                    </div>
                `;
            }

            content.innerHTML = `
                <div class="verify-student-name">${escapeHtml(data.name)}</div>

                <div class="verify-section">
                    <div class="verify-section-title">
                        <i class="fas fa-mobile-alt"></i>
                        إحضار الأجهزة
                    </div>
                    <div class="verify-status-large ${devicesClass}">${devicesIcon} ${devicesText}</div>
                    ${devicesTimeHtml}
                </div>

                <div class="verify-section">
                    <div class="verify-section-title">
                        <i class="fas fa-user-clock"></i>
                        الاستئذان
                    </div>
                    <div class="verify-status-large ${istiathanClass}">${istiathanIcon} ${istiathanText}</div>
                    ${istiathanTimeHtml}
                </div>

                ${infoHtml}
                ${notesHtml}

                <div class="verify-timestamp">
                    <i class="fas fa-check-circle"></i>
                    تم التحديث بواسطة: محمد ماهر او عبدالله العوض
                </div>
                <div class="refresh-indicator">
                    <i class="fas fa-sync-alt"></i>
                    يتم التحديث تلقائياً
                </div>
            `;

            lastDevicesTime = devicesTime;
            lastIstiathanTime = istiathanTime;

            if (timeIntervalDevices) clearInterval(timeIntervalDevices);
            if (timeIntervalIstiathan) clearInterval(timeIntervalIstiathan);

            if (devicesStatus && devicesTime) {
                timeIntervalDevices = setInterval(updateTimerDevices, 1000);
            }
            if (istiathanStatus && istiathanTime) {
                timeIntervalIstiathan = setInterval(updateTimerIstiathan, 1000);
            }
        }

        loadStudentStatus();
    </script>
</body>
</html>
