<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>Musta'athin · Teacher Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
    <div class="app-container">
        <header class="school-header">
            <h1><i class="fas fa-graduation-cap"></i> Musta'athin</h1>
            <div class="badge-school"><i class="fas fa-school"></i> Hawazen High School</div>
        </header>

        <div class="dashboard-grid">
            <div class="card">
                <div class="card-header">
                    <h2><i class="fas fa-chalkboard-teacher"></i> Teacher Dashboard</h2>
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Search student..." oninput="filterStudents()" />
                        <button><i class="fas fa-search"></i></button>
                    </div>
                </div>

                <div class="student-list" id="studentList">
                    <div class="loading-message"><i class="fas fa-spinner fa-spin"></i> Loading students...</div>
                </div>

                <div class="history-log">
                    <h4><i class="fas fa-clock-rotate-left"></i> Recent Activity</h4>
                    <div id="historyLogContainer">
                        <div class="loading-message"><i class="fas fa-spinner fa-spin"></i> Loading history...</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2><i class="fas fa-qrcode"></i> Student QR</h2>
                    <span style="font-size:0.7rem; color:#6f8da6;">Permanent · Never changes</span>
                </div>
                <div class="qr-preview">
                    <div id="qrcode-container"></div>
                    <div class="qr-label" id="qrStudentName">Select a student</div>
                    <div class="qr-sub">Scan to verify status</div>
                </div>

                <div class="verification-panel">
                    <h3><i class="fas fa-shield-alt"></i> Live Verification</h3>
                    <div class="verify-student" id="verificationDisplay">
                        <span class="student-badge" id="verifyName">Select a student</span>
                        <span class="verify-status" id="verifyStatusBadge">—</span>
                    </div>
                    <div class="verify-hint">
                        <i class="fas fa-camera"></i> QR code points to hidden verification page
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
